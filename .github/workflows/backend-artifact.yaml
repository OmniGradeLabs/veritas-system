name: Backend CD

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-cd-main
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/omnigrade-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/omnigrade-backend:v${{ github.run_number }}
            ghcr.io/omnigradelabs/omnigrade-backend:latest
            ghcr.io/omnigradelabs/omnigrade-backend:v${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
